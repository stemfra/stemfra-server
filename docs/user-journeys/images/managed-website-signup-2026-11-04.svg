<text x="80" y="174.9" font-family="Arial,sans-serif" font-size="65" font-weight="700" fill="#211D1A">Managed website signup</text>
<text x="80" y="232.8" font-family="Arial,sans-serif" font-size="30" font-weight="400" fill="#69655F">Implemented journey and review checkpoints · 4 November 2026</text>
<rect x="80" y="276" width="1320" height="62" rx="12" fill="#EAF3ED" stroke="#EAF3ED" stroke-width="2"/>
<text x="105" y="315.08" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#1E6650">Hosted setup and paid recovery verified</text>
<rect x="1470" y="276" width="850" height="62" rx="12" fill="#EAF3ED" stroke="#EAF3ED" stroke-width="2"/>
<text x="1495" y="314.22" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#1E6650">Production paid signup enabled with approval</text>
<rect x="80" y="380" width="1320" height="150" rx="18" fill="white" stroke="#DDD9D2" stroke-width="2"/>
<rect x="108" y="404" width="58" height="58" rx="29" fill="#EAF3ED" stroke="#EAF3ED" stroke-width="2"/>
<text x="125" y="439.8" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1E6650">1</text>
<text x="192" y="433.82" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#211D1A">Choose a website</text>
<text x="192" y="480.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">Select a product or template on the marketing site.</text>
<path d="M740 534V549m-8 -2 8 12 8 -12" fill="none" stroke="#69655F" stroke-width="3"/>
<rect x="80" y="564" width="1320" height="178" rx="18" fill="white" stroke="#DDD9D2" stroke-width="2"/>
<rect x="108" y="588" width="58" height="58" rx="29" fill="#EAF3ED" stroke="#EAF3ED" stroke-width="2"/>
<text x="125" y="623.8" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1E6650">2</text>
<text x="192" y="617.82" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#211D1A">Review price and subscribe</text>
<text x="192" y="664.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">Regional price, subscription terms and consent.</text>
<text x="192" y="702.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">Subscribe opens Whop directly. No duplicate signup form.</text>
