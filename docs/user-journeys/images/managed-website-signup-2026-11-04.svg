<text x="192" y="829.82" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#211D1A">Pay securely through Whop</text>
<text x="192" y="876.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">Whop collects payment and customer information.</text>
<text x="192" y="914.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">The selected template and business type stay bound.</text>
<path d="M740 958V973m-8 -2 8 12 8 -12" fill="none" stroke="#69655F" stroke-width="3"/>
<rect x="80" y="988" width="1320" height="178" rx="18" fill="white" stroke="#DDD9D2" stroke-width="2"/>
<rect x="108" y="1012" width="58" height="58" rx="29" fill="#EAF3ED" stroke="#EAF3ED" stroke-width="2"/>
<text x="125" y="1047.8" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1E6650">4</text>
<text x="192" y="1041.82" font-family="Arial,sans-serif" font-size="37" font-weight="700" fill="#211D1A">Verify the purchase email</text>
<text x="192" y="1088.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">Return to CMS and enter the emailed OTP.</text>
<text x="192" y="1126.08" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#69655F">An existing verified owner can resume the same purchase.</text>
<path d="M740 1170V1185m-8 -2 8 12 8 -12" fill="none" stroke="#69655F" stroke-width="3"/>
<rect x="80" y="1200" width="1320" height="178" rx="18" fill="white" stroke="#DDD9D2" stroke-width="2"/>
